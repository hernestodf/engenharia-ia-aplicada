name: cd

# Deploy é desligado por padrão. Este workflow apenas prepara um artefato.
# Publicar em produção exige autorização explícita e mudança deliberada aqui.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-artifact:
    name: Preparar artefato (sem deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar antes de empacotar
        run: python3 scripts/validate_catalog.py
      - name: Empacotar fonte canônica
        run: |
          tar --exclude=.git -czf godnaterra.tar.gz \
            AGENTS.md project.yaml MANIFESTO.md \
            skills agents adapters scripts tests evaluations design-system docs
      - uses: actions/upload-artifact@v4
        with:
          name: godnaterra-source
          path: godnaterra.tar.gz
