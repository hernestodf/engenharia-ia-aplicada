name: release

# Publica um tarball completo + SHA256SUMS como Release do GitHub.
# NAO faz deploy, NAO reindexa, NAO rotaciona segredo, NAO toca producao.
# Release so acontece via tag v* (push explicito) ou workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publicar release (somente tag/dispatch)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      # PIN: SHA obtido via git ls-remote em 2026-11-19. Tag: v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # PIN: SHA obtido via git ls-remote em 2026-11-19. Tag: v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validar fonte canônica
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/validate_incidents.py
          python3 scripts/godnaterra.py audit
          python3 scripts/generate_manifest.py --check
          python3 -m unittest discover -s tests

      - name: Empacotar pacote completo
        run: |
          VERSAO=$(tr -d '\r\n' < VERSION)
          NOME="godnaterra-${VERSAO}"
          tar --exclude=.git --exclude=.opencode --exclude=.claude \
            -czf "${NOME}.tar.gz" \
            AGENTS.md project.yaml MANIFESTO.md README.md CHANGELOG.md \
            VERSION SECURITY_CLASSIFICATION.md install-manifest.json .github \
            skills agents adapters scripts tests evaluations design-system docs
          sha256sum "${NOME}.tar.gz" install-manifest.json > SHA256SUMS
          echo "ASSET=${NOME}.tar.gz" >> "$GITHUB_ENV"
          echo "VERSAO=${VERSAO}" >> "$GITHUB_ENV"

      # PIN: SHA obtido via git ls-remote em 2026-11-19. Tag: v4
      - name: Publicar artefato do tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godnaterra-source
          path: |
            ${{ env.ASSET }}
            SHA256SUMS

      - name: Criar Release com checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSET}" SHA256SUMS \
            --title "Godnaterra ${VERSAO}" \
            --notes "Pacote vendor-free, isolado por cliente. Verifique com: sha256sum -c SHA256SUMS" \
            --verify-tag
